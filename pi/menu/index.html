<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  :root { --bg: #07070b; --tile: #12121a; --line: #23232e; --text: #f4f4f8; --dim: #8b8b99; --accent: #3fa9f5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; cursor: none;
               font-family: ui-monospace, "DejaVu Sans Mono", Menlo, monospace; }
  body { display: flex; flex-direction: column; padding: 4vh 5vw; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4vh; }
  h1 { margin: 0; font-size: 5vh; letter-spacing: .3vh; }
  h1 span { color: var(--accent); }
  #clock { font-size: 5vh; color: var(--dim); }
  #grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 3vh; }
  .tile { background: var(--tile); border: .5vh solid var(--line); border-radius: 2.5vh; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 2vh; transition: transform .12s, border-color .12s, background .12s; }
  .tile .icon { font-size: 13vh; line-height: 1; }
  .tile .name { font-size: 3.6vh; text-align: center; padding: 0 1vw; }
  .tile .sub { font-size: 2.2vh; color: var(--dim); margin-top: -1vh; }
  .tile.on { border-color: var(--accent); background: #10263a; transform: scale(1.05); box-shadow: 0 0 4vh rgba(63, 169, 245, .35); }
  footer { margin-top: 3vh; display: flex; justify-content: space-between; color: var(--dim); font-size: 2.4vh; }
  #toast { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 6vh; background: rgba(0,0,0,.75); }
</style>
</head>
<body>
<header><h1>AHLERSMEYER <span>HOME</span></h1><div id="clock"></div></header>
<div id="grid"></div>
<footer><div>D-pad to pick · A to open</div><div>Hold SELECT + START anytime to come back here</div></footer>
<div id="toast"></div>
<script>
const grid = document.getElementById('grid');
let tiles = [], sel = 0, idleMs = 5 * 60000, idleTile = 'wall', lastInput = Date.now(), busy = false;
const COLS = 4;

function clock() {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
setInterval(clock, 1000); clock();

function draw() {
  grid.innerHTML = '';
  tiles.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'tile' + (i === sel ? ' on' : '');
    el.innerHTML = `<div class="icon">${t.icon || '⭐'}</div><div class="name">${t.name}</div>${t.sub ? `<div class="sub">${t.sub}</div>` : ''}`;
    el.onclick = () => { sel = i; draw(); open(); };
    grid.appendChild(el);
  });
}

function move(dx, dy) {
  lastInput = Date.now();
  const n = tiles.length;
  if (dx) sel = (sel + dx + n) % n;
  if (dy) { const s = sel + dy * COLS; if (s >= 0 && s < n) sel = s; }
  draw();
}

async function open(id) {
  if (busy) return;
  busy = true;
  const t = id ? tiles.find(x => x.id === id) : tiles[sel];
  const toast = document.getElementById('toast');
  toast.textContent = `Opening ${t.name}...`; toast.style.display = 'flex';
  if (demo) {  // on a regular computer there's no Pi launcher: just go to the page
    if (!t.url) { toast.textContent = `${t.name} only runs on the Pi`; setTimeout(() => { busy = false; toast.style.display = 'none'; }, 2000); return; }
    location.href = t.url; return;
  }
  try { await fetch('/open?id=' + encodeURIComponent(t.id)); } catch {}
  setTimeout(() => { busy = false; toast.style.display = 'none'; }, 8000);
}

addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') move(-1, 0);
  else if (e.key === 'ArrowRight') move(1, 0);
  else if (e.key === 'ArrowUp') move(0, -1);
  else if (e.key === 'ArrowDown') move(0, 1);
  else if (e.key === 'Enter' || e.key === ' ') open();
});
addEventListener('mousemove', () => { lastInput = Date.now(); });
// Coming back with the browser's Back button restores the page mid-"Opening...": reset it.
addEventListener('pageshow', () => { busy = false; document.getElementById('toast').style.display = 'none'; lastInput = Date.now(); });

// Controllers: D-pad / stick to move, any face button or START to open.
const prev = {};
function poll() {
  for (const gp of navigator.getGamepads ? navigator.getGamepads() : []) {
    if (!gp) continue;
    const b = i => !!gp.buttons[i]?.pressed;
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    const now = {
      left: b(14) || ax < -0.5, right: b(15) || ax > 0.5, up: b(12) || ay < -0.5, down: b(13) || ay > 0.5,
      go: b(0) || b(1) || b(2) || b(3) || b(9),
    };
    const p = prev[gp.index] || {};
    if (now.left && !p.left) move(-1, 0);
    if (now.right && !p.right) move(1, 0);
    if (now.up && !p.up) move(0, -1);
    if (now.down && !p.down) move(0, 1);
    // Ignore a button still held from SELECT+START when the menu first loads.
    if (now.go && !p.go && (p.seen || performance.now() > 2000)) open();
    now.seen = true;
    prev[gp.index] = now;
  }
  requestAnimationFrame(poll);
}
requestAnimationFrame(poll);

// Nobody using the menu for a while? Go back to the wall.
setInterval(() => { if (!busy && Date.now() - lastInput > idleMs) open(idleTile); }, 15000);

// The same menu on a regular computer (…/pi/menu/?demo): tiles just open their pages here.
const wallKey = (location.hash.match(/w=([A-Za-z0-9_-]{12,})/) || [])[1] || localStorage.getItem('pixelWallId') || '';
if (wallKey) localStorage.setItem('pixelWallId', wallKey);
const GH = 'https://samahlersmeyer-prog.github.io/';
const DEMO = { idleMinutes: 99, games: 0, tiles: [
  { id: 'wall', name: 'Pixel Wall', icon: '🧱', url: '../../display/#w=' + wallKey }, { id: 'arcade', name: 'Dawg Arcade', icon: '🕹️', url: GH + 'dawg-arcade/' },
  { id: 'bigdawg', name: 'Big Dawg Daily', icon: '🐶', url: GH + 'bigdawg/' },
  { id: 'games', name: 'Retro Games', icon: '🎮', type: 'games' }, { id: 'junglejam', name: 'Jungle Jam', icon: '🦁', url: GH + 'jungle-jam-player/' },
  { id: 'glam', name: 'Glam Studio', icon: '💅', url: GH + 'glam-studio/' }, { id: 'frontoffice', name: 'Front Office', icon: '⚾', url: GH + 'front-office/' },
  { id: 'calendar', name: 'Family Calendar', icon: '📅', url: GH + 'family-calendar/' }] };
const demo = location.search.includes('demo');
if (demo) window.fetch = (u => async x => x.startsWith('/open') ? new Response('{}') : u(x))(window.fetch);
(demo ? Promise.resolve(DEMO) : fetch('/config').then(r => r.json())).then(c => {
  tiles = c.tiles; idleMs = (c.idleMinutes || 5) * 60000; idleTile = c.idleTile || 'wall';
  const g = tiles.find(t => t.type === 'games');
  if (g) g.sub = demo ? 'on the Pi' : c.games ? `${c.games} games` : 'add games to ~/roms';
  draw();
});
</script>
</body>
</html>
